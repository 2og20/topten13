<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOPTEN10 Digital System</title>
    <!-- تضمين مكتبة Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- تضمين الخط العربي العادي الاحترافي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة تصدير الـ PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --navy-royal: #002366;
            --ice-gray: #F3F4F6;
        }
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--ice-gray); 
            user-select: none; 
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: contain;
        }
        .navy-bg { background-color: var(--navy-royal); }
        .navy-text { color: var(--navy-royal); }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card-grad { background: linear-gradient(135deg, #002366 0%, #1e40af 100%); }
        .active-press:active { transform: scale(0.96); transition: 0.1s; }
        
        /* تحسينات الطباعة والفاتورة */
        @media print {
            body * { visibility: hidden; }
            #invoice-to-save, #invoice-to-save * { visibility: visible; }
            #invoice-to-save { position: fixed; left: 0; top: 0; width: 100%; }
        }
        
        /* تخصيص السكرول بار */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>

<body class="pb-32">

    <!-- نافذة الفاتورة (Modal) -->
    <div id="invoice-modal" class="fixed inset-0 bg-slate-900/95 z-[200] hidden items-center justify-center p-4 overflow-y-auto">
        <div class="w-full max-w-sm">
            <div id="invoice-to-save" class="bg-white rounded-[2.5rem] p-8 shadow-2xl">
                <div class="text-center border-b-2 border-dashed border-slate-200 pb-4 mb-4">
                    <h2 class="text-2xl font-black navy-text tracking-tighter uppercase">TOPTEN10</h2>
                    <p class="text-[10px] text-slate-400 font-bold mt-1">فاتورة مبيعات رقمية</p>
                </div>
                
                <div class="space-y-4 text-sm">
                    <div class="flex justify-between text-[10px] font-bold">
                        <span class="text-slate-400">رقم العملية:</span> <span id="inv-id" class="text-slate-800 font-bold">#0000</span>
                    </div>
                    <div class="flex justify-between text-[10px] font-bold">
                        <span class="text-slate-400">التاريخ:</span> <span id="inv-date" class="text-slate-800 font-bold">--/--</span>
                    </div>
                    <hr class="border-dashed border-slate-100">
                    <div class="py-2">
                        <div class="flex justify-between items-center mb-1">
                            <span id="inv-item" class="font-black text-slate-800 text-lg">المنتج</span>
                            <span id="inv-qty" class="bg-blue-50 text-blue-700 px-3 py-1 rounded-full font-black text-xs">x1</span>
                        </div>
                        <div class="flex justify-between text-[11px] font-bold">
                            <span class="text-slate-400">السعر الأصلي:</span>
                            <span id="inv-original-price" class="text-slate-600">0</span>
                        </div>
                        <div id="inv-discount-row" class="flex justify-between text-[11px] font-bold text-red-500 hidden">
                            <span>الخصم:</span>
                            <span>- <span id="inv-discount-val">0</span></span>
                        </div>
                    </div>
                    <div class="flex justify-between items-center navy-bg p-5 rounded-3xl text-white shadow-xl shadow-blue-900/20">
                        <span class="font-bold text-[10px] opacity-70">الإجمالي الصافي</span>
                        <span id="inv-total" class="text-2xl font-black">0</span>
                    </div>
                </div>
                <div class="mt-8 pt-4 border-t border-slate-50 text-center">
                    <p class="text-[9px] text-slate-300 font-black uppercase tracking-widest">شكراً لتعاملكم مع توب تن</p>
                </div>
            </div>

            <div class="mt-6 space-y-3">
                <button onclick="downloadPDF()" class="w-full bg-green-600 text-white py-4 rounded-3xl font-black shadow-lg active-press">حفظ كـ PDF</button>
                <button onclick="closeInvoice()" class="w-full bg-white/10 text-white py-4 rounded-3xl font-bold text-xs backdrop-blur-md border border-white/20 active-press">رجوع</button>
            </div>
        </div>
    </div>

    <!-- الهيدر الرئيسي -->
    <header class="glass sticky top-0 z-50 border-b border-slate-200 p-4 mb-4">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black navy-text tracking-tighter">TOPTEN10</h1>
                <p id="current-date-display" class="text-[10px] text-slate-400 font-black"></p>
            </div>
            <button onclick="showTab('settings')" class="bg-slate-100 p-3 rounded-2xl text-slate-500 active-press">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
            </button>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4">
        
        <!-- لوحة التحكم (الرئيسية) -->
        <section id="dash" class="tab-content active space-y-4">
            <div class="card-grad p-6 rounded-[2.5rem] text-white shadow-2xl shadow-blue-900/30">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-blue-100 text-[10px] font-bold opacity-80 tracking-widest">إجمالي مبيعات الوردية</p>
                        <h2 id="today-total" class="text-4xl font-black mt-1">0</h2>
                    </div>
                    <button onclick="confirmClosing()" class="bg-white/20 px-4 py-2 rounded-2xl text-[10px] font-black border border-white/10 active-press">إقفال الوردية</button>
                </div>
                <div class="mt-8 grid grid-cols-2 gap-4">
                    <div class="bg-white/10 p-4 rounded-3xl backdrop-blur-sm">
                        <p class="text-[10px] text-blue-200 mb-1 font-bold">النقد (كاش)</p>
                        <p id="dash-cash" class="font-black text-xl">0</p>
                    </div>
                    <div class="bg-white/10 p-4 rounded-3xl backdrop-blur-sm">
                        <p class="text-[10px] text-blue-200 mb-1 font-bold">المحافظ</p>
                        <p id="dash-wallets" class="font-black text-xl">0</p>
                    </div>
                </div>
            </div>
            
            <div class="bg-white p-6 rounded-[2.5rem] border border-slate-200">
                <h4 class="text-[10px] font-black text-slate-400 uppercase mb-4 tracking-widest">سجل العمليات الحالية</h4>
                <div id="recent-log" class="space-y-3 max-h-80 overflow-y-auto pr-2 font-bold"></div>
            </div>
        </section>

        <!-- المبيعات (POS) -->
        <section id="pos" class="tab-content space-y-4">
            <div class="bg-white p-6 rounded-[2.5rem] border border-slate-200 font-bold">
                <div class="space-y-5">
                    <div class="space-y-2">
                        <label class="text-[11px] font-black text-slate-400 mr-2 uppercase">اختيار الصنف</label>
                        <select id="pos-item" class="w-full p-5 bg-slate-50 rounded-3xl outline-none font-black text-slate-700 border-2 border-transparent focus:border-blue-200 transition-all"></select>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="text-[11px] font-black text-slate-400 mr-2 uppercase">الكمية</label>
                            <input type="number" id="pos-qty" value="1" min="1" class="w-full p-5 bg-slate-50 rounded-3xl text-center text-2xl font-black navy-text outline-none">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[11px] font-black text-red-400 mr-2 uppercase">خصم مبلغ</label>
                            <input type="number" id="pos-discount" value="0" min="0" class="w-full p-5 bg-red-50 rounded-3xl text-center text-2xl font-black text-red-500 outline-none">
                        </div>
                    </div>

                    <div class="flex gap-3">
                        <button onclick="setPayment('cash')" id="btn-cash" class="flex-1 p-4 rounded-3xl border-2 border-blue-800 navy-bg text-white font-black text-xs active-press transition-all">💵 كاش</button>
                        <button onclick="setPayment('wallet')" id="btn-wallet" class="flex-1 p-4 rounded-3xl border-2 border-transparent bg-slate-100 text-slate-400 font-black text-xs active-press transition-all">📱 محفظة</button>
                    </div>

                    <div id="wallet-box" class="hidden">
                        <select id="pos-wallet" class="w-full p-5 bg-blue-50 rounded-3xl font-black text-blue-900 border border-blue-100 outline-none"></select>
                    </div>

                    <button onclick="processSale()" class="w-full navy-bg text-white p-6 rounded-[2rem] font-black text-lg shadow-xl shadow-blue-900/20 active-press">إتمام العملية وطباعة</button>
                </div>
            </div>
        </section>

        <!-- المخزون -->
        <section id="stock" class="tab-content space-y-4">
            <div class="bg-white p-6 rounded-[2.5rem] border border-slate-200 shadow-sm font-bold">
                <h3 class="font-black navy-text mb-4">إضافة منتج جديد</h3>
                <div class="space-y-3">
                    <input type="text" id="p-name" placeholder="اسم المنتج" class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold border border-slate-100 focus:border-blue-300">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" id="p-qty" placeholder="الكمية" class="p-4 bg-slate-50 rounded-2xl outline-none font-bold border border-slate-100">
                        <input type="number" id="p-cost" placeholder="التكلفة" class="p-4 bg-slate-50 rounded-2xl outline-none font-bold border border-slate-100">
                    </div>
                    <input type="number" id="p-price" placeholder="سعر البيع" class="w-full p-5 bg-blue-50 rounded-2xl outline-none font-black navy-text text-center text-xl border-2 border-blue-100">
                    <button onclick="saveItem()" class="w-full navy-bg text-white p-4 rounded-2xl font-black shadow-lg active-press">تأكيد الإضافة</button>
                </div>
            </div>
            <div id="stock-display" class="space-y-2 font-bold"></div>
        </section>

        <!-- التقارير والأرشيف -->
        <section id="reports" class="tab-content space-y-4 font-bold">
            <h3 class="font-black navy-text text-lg pr-2">الأرشيف</h3>
            <div id="history-display" class="space-y-3"></div>
        </section>

        <!-- الإعدادات والمصاريف -->
        <section id="settings" class="tab-content space-y-4 font-bold">
            <div class="bg-white p-6 rounded-[2.5rem] border border-slate-200 shadow-sm">
                <h3 class="font-black navy-text mb-4">المحافظ</h3>
                <div class="flex gap-2 mb-4">
                    <input type="text" id="new-wallet" placeholder="اسم المحفظة" class="flex-1 p-4 bg-slate-50 rounded-2xl outline-none text-xs font-bold border border-slate-100">
                    <button onclick="saveWallet()" class="navy-bg text-white px-6 rounded-2xl font-black">+</button>
                </div>
                <div id="wallets-display" class="space-y-2"></div>
            </div>
            
            <div class="bg-red-50 p-6 rounded-[2.5rem] border border-red-100">
                <h3 class="font-black text-red-600 mb-3 text-[11px] tracking-widest uppercase">المصاريف</h3>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="exp-name" placeholder="البيان" class="p-4 bg-white rounded-2xl outline-none text-xs font-bold border border-red-50">
                    <input type="number" id="exp-val" placeholder="المبلغ" class="p-4 bg-white rounded-2xl outline-none text-xs font-black text-red-600 border border-red-50">
                </div>
                <button onclick="saveExp()" class="w-full mt-3 bg-red-600 text-white p-4 rounded-2xl font-black shadow-md active-press">تسجيل مصروف</button>
            </div>

             <button onclick="resetEverything()" class="w-full p-4 text-slate-400 text-[10px] font-black opacity-50 underline">حذف كل البيانات</button>
        </section>
    </main>

    <!-- شريط التنقل السفلي -->
    <nav class="fixed bottom-6 left-6 right-6 glass rounded-[2.5rem] border border-slate-200 p-2 flex justify-around shadow-2xl z-[100] max-w-sm mx-auto">
        <button onclick="showTab('dash')" class="nav-btn p-4 rounded-full navy-text bg-blue-50" data-tab="dash"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg></button>
        <button onclick="showTab('pos')" class="nav-btn p-4 rounded-full text-slate-300" data-tab="pos"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg></button>
        <button onclick="showTab('stock')" class="nav-btn p-4 rounded-full text-slate-300" data-tab="stock"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg></button>
        <button onclick="showTab('reports')" class="nav-btn p-4 rounded-full text-slate-300" data-tab="reports"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg></button>
    </nav>

    <!-- التنبيهات -->
    <div id="toast" class="fixed top-8 left-1/2 -translate-x-1/2 navy-bg text-white px-8 py-3 rounded-full text-[11px] font-black opacity-0 transition-all z-[300] shadow-2xl shadow-blue-900/40"></div>

    <script>
        // قاعدة البيانات
        let db = {
            stock: JSON.parse(localStorage.getItem('tt10_stock')) || [],
            sales: JSON.parse(localStorage.getItem('tt10_sales')) || [],
            exp: JSON.parse(localStorage.getItem('tt10_exp')) || [],
            history: JSON.parse(localStorage.getItem('tt10_history')) || [],
            wallets: JSON.parse(localStorage.getItem('tt10_wallets')) || ['الكريمي', 'جيب', 'باسي كاش']
        };

        let currentPayMode = 'cash';

        function save() {
            localStorage.setItem('tt10_stock', JSON.stringify(db.stock));
            localStorage.setItem('tt10_sales', JSON.stringify(db.sales));
            localStorage.setItem('tt10_exp', JSON.stringify(db.exp));
            localStorage.setItem('tt10_history', JSON.stringify(db.history));
            localStorage.setItem('tt10_wallets', JSON.stringify(db.wallets));
            render();
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('navy-text', 'bg-blue-50');
                b.classList.add('text-slate-300');
            });
            const btn = document.querySelector(`[data-tab="${id}"]`);
            btn.classList.remove('text-slate-300');
            btn.classList.add('navy-text', 'bg-blue-50');
        }

        function setPayment(m) {
            currentPayMode = m;
            const bCash = document.getElementById('btn-cash');
            const bWallet = document.getElementById('btn-wallet');
            if(m === 'cash') {
                bCash.className = 'flex-1 p-4 rounded-3xl border-2 border-blue-800 navy-bg text-white font-black text-xs active-press';
                bWallet.className = 'flex-1 p-4 rounded-3xl border-2 border-transparent bg-slate-100 text-slate-400 font-black text-xs active-press';
            } else {
                bWallet.className = 'flex-1 p-4 rounded-3xl border-2 border-blue-800 navy-bg text-white font-black text-xs active-press';
                bCash.className = 'flex-1 p-4 rounded-3xl border-2 border-transparent bg-slate-100 text-slate-400 font-black text-xs active-press';
            }
            document.getElementById('wallet-box').classList.toggle('hidden', m !== 'wallet');
        }

        function processSale() {
            const sid = document.getElementById('pos-item').value;
            const qty = parseInt(document.getElementById('pos-qty').value);
            const disc = parseFloat(document.getElementById('pos-discount').value) || 0;
            const item = db.stock.find(i => i.id == sid);

            if(!sid) return showToast("⚠️ اختر صنفاً");
            if(!item || item.qty < qty) return showToast("❌ الكمية غير كافية");
            const total = (item.price * qty) - disc;

            const sale = {
                id: Math.floor(1000 + Math.random()*9000),
                name: item.name, qty, original: item.price * qty, disc, total,
                cost: item.cost * qty, mode: currentPayMode,
                wallet: currentPayMode === 'wallet' ? document.getElementById('pos-wallet').value : '-',
                date: new Date().toISOString()
            };

            item.qty -= qty;
            db.sales.push(sale);
            save();
            openInvoice(sale);
            document.getElementById('pos-qty').value = 1;
            document.getElementById('pos-discount').value = 0;
        }

        function openInvoice(s) {
            document.getElementById('inv-id').innerText = "#" + s.id;
            document.getElementById('inv-date').innerText = new Date(s.date).toLocaleDateString('ar-YE');
            document.getElementById('inv-item').innerText = s.name;
            document.getElementById('inv-qty').innerText = "x" + s.qty;
            document.getElementById('inv-original-price').innerText = s.original.toLocaleString();
            if(s.disc > 0) {
                document.getElementById('inv-discount-row').classList.remove('hidden');
                document.getElementById('inv-discount-val').innerText = s.disc.toLocaleString();
            } else document.getElementById('inv-discount-row').classList.add('hidden');
            document.getElementById('inv-total').innerText = s.total.toLocaleString();
            document.getElementById('invoice-modal').classList.replace('hidden', 'flex');
        }

        function downloadPDF() {
            const element = document.getElementById('invoice-to-save');
            html2pdf().from(element).save('TOPTEN-Bill.pdf');
            showToast("📂 تم الحفظ");
        }

        function closeInvoice() { document.getElementById('invoice-modal').classList.replace('flex', 'hidden'); }

        function saveItem() {
            const n = document.getElementById('p-name').value;
            const q = parseInt(document.getElementById('p-qty').value);
            const c = parseFloat(document.getElementById('p-cost').value);
            const p = parseFloat(document.getElementById('p-price').value);
            if(n && !isNaN(p)) {
                db.stock.push({id: Date.now(), name: n, qty: q, cost: c, price: p});
                save();
                showToast("📦 تمت الإضافة");
                document.querySelectorAll('#stock input').forEach(i => i.value = '');
            }
        }

        function saveExp() {
            const n = document.getElementById('exp-name').value;
            const v = parseFloat(document.getElementById('exp-val').value);
            if(n && v) {
                db.exp.push({id: Date.now(), name: "مصروف: " + n, val: v, date: new Date().toISOString()});
                save();
                showToast("💸 تم التسجيل");
                document.getElementById('exp-name').value = '';
                document.getElementById('exp-val').value = '';
            }
        }

        function saveWallet() {
            const w = document.getElementById('new-wallet').value;
            if(w && !db.wallets.includes(w)) { db.wallets.push(w); save(); }
        }

        function deleteWallet(w) { db.wallets = db.wallets.filter(item => item !== w); save(); }

        function confirmClosing() {
            if(confirm("إقفال الوردية وترحيل البيانات؟")) {
                const sTotal = db.sales.reduce((a,b) => a+b.total, 0);
                const eTotal = db.exp.reduce((a,b) => a+b.val, 0);
                db.history.push({
                    date: new Date().toLocaleDateString('ar-YE', {day: 'numeric', month: 'short'}),
                    net: sTotal - eTotal,
                    expenses: eTotal
                });
                db.sales = []; db.exp = []; save();
            }
        }

        function resetEverything() { if(confirm("حذف كل شيء؟")) { localStorage.clear(); location.reload(); } }

        function render() {
            document.getElementById('pos-item').innerHTML = '<option value="">-- اختر --</option>' + db.stock.map(i => `<option value="${i.id}">${i.name} (${i.qty})</option>`).join('');
            document.getElementById('pos-wallet').innerHTML = db.wallets.map(w => `<option value="${w}">${w}</option>`).join('');
            document.getElementById('wallets-display').innerHTML = db.wallets.map(w => `<div class="flex justify-between p-3 bg-slate-50 rounded-xl"><span>${w}</span><button onclick="deleteWallet('${w}')" class="text-red-400">حذف</button></div>`).join('');
            document.getElementById('stock-display').innerHTML = db.stock.map(i => `<div class="bg-white p-4 rounded-2xl flex justify-between shadow-sm"><span>${i.name} (${i.qty})</span><span class="navy-text">${i.price}</span></div>`).join('');
            
            const logs = [...db.sales.map(s => ({...s, t: 's'})), ...db.exp.map(e => ({...e, t: 'e', total: -e.val}))];
            document.getElementById('recent-log').innerHTML = logs.sort((a,b) => new Date(b.date) - new Date(a.date)).map(l => `<div class="p-3 flex justify-between"><span class="${l.t==='s'?'text-blue-900':'text-red-500'}">${l.name}</span><span>${l.total}</span></div>`).join('');
            
            const sT = db.sales.reduce((a,b) => a+b.total, 0);
            const cT = db.sales.filter(s => s.mode === 'cash').reduce((a,b) => a+b.total, 0);
            const wT = db.sales.filter(s => s.mode === 'wallet').reduce((a,b) => a+b.total, 0);
            const eT = db.exp.reduce((a,b) => a+b.val, 0);

            document.getElementById('today-total').innerText = sT.toLocaleString();
            document.getElementById('dash-cash').innerText = (cT - eT).toLocaleString();
            document.getElementById('dash-wallets').innerText = wT.toLocaleString();
            document.getElementById('current-date-display').innerText = new Date().toLocaleDateString('ar-YE', {weekday: 'long', day: 'numeric', month: 'long'});
            document.getElementById('history-display').innerHTML = db.history.slice().reverse().map(h => `<div class="bg-white p-4 rounded-3xl flex justify-between mb-2"><span>${h.date}</span><span class="navy-text font-black">${h.net}</span></div>`).join('');
        }

        function showToast(m) {
            const t = document.getElementById('toast'); t.innerText = m; t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2500);
        }

        window.onload = () => render();
    </script>
</body>
</html>

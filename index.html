<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- وسوم جعل الموقع يعمل كتطبيق مستقل على الأيفون -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TOPTEN10">
    
    <title>TOPTEN10 Digital System</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #F3F4F6; 
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
        }
        .navy-bg { background-color: #002366; }
        .navy-text { color: #002366; }
        .main-card {
            background: linear-gradient(135deg, #002366 0%, #1e40af 100%);
            border-radius: 40px;
        }
        /* دعم مساحة النوتش في الأيفون */
        header { padding-top: env(safe-area-inset-top); }
        nav { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="pb-32">

    <header class="bg-white border-b border-gray-200 p-4 sticky top-0 z-50">
        <div class="flex justify-between items-center max-w-lg mx-auto">
            <div class="bg-gray-100 p-2 rounded-2xl">
                <i data-lucide="sliders-horizontal" class="w-6 h-6 text-gray-500"></i>
            </div>
            <div class="text-right">
                <h1 class="text-xl font-black navy-text tracking-tighter">TOPTEN10</h1>
                <p class="text-[10px] text-gray-400 font-bold">الاثنين، ٤ مايو</p>
            </div>
        </div>
    </header>

    <main class="max-w-lg mx-auto p-4 space-y-6">
        <!-- البطاقة الرئيسية -->
        <div class="main-card p-8 text-white shadow-2xl relative overflow-hidden">
            <div class="flex justify-between items-start mb-10">
                <button class="bg-white/20 backdrop-blur-md border border-white/10 px-6 py-2 rounded-2xl text-xs font-bold">إقفال الوردية</button>
                <div class="text-right">
                    <p class="text-blue-100 text-xs mb-1 opacity-80">إجمالي مبيعات الوردية</p>
                    <h2 class="text-6xl font-black">0</h2>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white/10 backdrop-blur-md p-5 rounded-[2rem] text-right border border-white/5">
                    <p class="text-blue-200 text-[10px] mb-1 font-bold">النقد (كاش)</p>
                    <p class="text-2xl font-bold">0</p>
                </div>
                <div class="bg-white/10 backdrop-blur-md p-5 rounded-[2rem] text-right border border-white/5">
                    <p class="text-blue-200 text-[10px] mb-1 font-bold">المحافظ</p>
                    <p class="text-2xl font-bold">0</p>
                </div>
            </div>
        </div>

        <!-- سجل العمليات -->
        <div class="bg-white rounded-[2.5rem] p-12 shadow-sm border border-gray-100 text-center">
            <p class="text-gray-400 font-bold text-sm">سجل العمليات الحالية</p>
        </div>
    </main>

    <!-- شريط التنقل السفلي المصمم للأيفون -->
    <nav class="fixed bottom-6 left-6 right-6 z-50">
        <div class="bg-white/90 backdrop-blur-xl h-20 rounded-[2.5rem] shadow-2xl border border-white/20 flex justify-around items-center px-4 max-w-md mx-auto">
            <button class="p-3 text-gray-300"><i data-lucide="file-text" class="w-7 h-7"></i></button>
            <button class="p-3 text-gray-300"><i data-lucide="package" class="w-7 h-7"></i></button>
            <button class="p-3 text-gray-300"><i data-lucide="shopping-bag" class="w-7 h-7"></i></button>
            <button class="bg-blue-50 p-4 rounded-3xl navy-text shadow-inner">
                <i data-lucide="home" class="w-7 h-7"></i>
            </button>
        </div>
    </nav>

    <script>
        // تفعيل الأيقونات
        lucide.createIcons();

        // هذا الجزء يضمن استقرار الواجهة عند الاستخدام كتطبيق
        document.addEventListener('touchmove', function (e) {
            if (e.scale !== 1) { e.preventDefault(); }
        }, { passive: false });
    </script>
</body>
</html>
    </script>
</body>
</html>
